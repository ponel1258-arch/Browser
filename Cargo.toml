[package]
name = "luma-browser"
version = "0.2.0"
edition = "2021"
rust-version = "1.93"

[[bin]]
name = "luma"
path = "native/main.rs"

[dependencies]
wry = "0.57.2"
tao = "0.37.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
