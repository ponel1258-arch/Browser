<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191e">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; form-action https://www.google.com">
  <title>Новая вкладка</title>
  <link rel="stylesheet" href="home.css">
  <script src="home.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#search">Перейти к поиску</a>
  <main class="home">
    <header class="home-header"><a class="signature" href="home.html" aria-label="Luma — главная"><span aria-hidden="true">l</span><span>Luma</span></a><div class="header-right"><time id="today"></time><button id="theme" type="button" aria-label="Включить светлую тему" title="Включить светлую тему"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button></div></header>
    <section class="center" aria-labelledby="wordmark">
      <div class="identity"><span class="orbit" aria-hidden="true"><i></i><i></i><i></i></span><h1 id="wordmark">С чего начнём?</h1></div>
      <p class="subtitle">Поиск в Google и ваши любимые сайты</p>
      <form class="search" action="https://www.google.com/search" method="get">
        <svg class="magnify" aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>
        <input id="search" type="search" name="q" placeholder="Найти в Google…" aria-label="Искать в Google" autocomplete="off" spellcheck="false" required>
        <button type="submit" aria-label="Искать"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </form>
      <nav class="links" aria-label="Быстрый доступ">
        <a href="https://www.youtube.com"><span class="site-icon youtube"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="5"/><path d="m10 9 5 3-5 3z"/></svg></span><span>YouTube</span></a>
        <a href="https://www.google.com"><span class="site-icon google" aria-hidden="true">G</span><span>Google</span></a>
        <a href="https://github.com"><span class="site-icon github"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 21v-4c-4 .6-5-2-5-2m14 6v-4c0-1-1-2-1-2 4-.5 5-2.5 5-5a5 5 0 0 0-1.5-3.5c.2-1 0-2-.5-3-2 0-3 1-3 1-3-1-5-1-8 0 0 0-1-1-3-1-.5 1-.7 2-.5 3A5 5 0 0 0 4 10c0 2.5 1 4.5 5 5 0 0-1 1-1 2"/></svg></span><span>GitHub</span></a>
        <a href="https://ru.wikipedia.org"><span class="site-icon wiki" aria-hidden="true">W</span><span>Wikipedia</span></a>
        <a href="https://www.twitch.tv"><span class="site-icon twitch"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 3h17v12l-5 5h-5l-4 3v-3H3V7zm5 5v6m6-6v6"/></svg></span><span>Twitch</span></a>
        <a href="https://www.reddit.com"><span class="site-icon reddit" aria-hidden="true">r/</span><span>Reddit</span></a>
      </nav>

    </section>
    <footer><span class="footer-brand">Пространство для вашего интернета</span><details class="shortcuts"><summary>Горячие клавиши <span aria-hidden="true">⌘</span></summary><div><p><span>Адресная строка</span><kbd>Ctrl / ⌘ + L</kbd></p><p><span>Новая вкладка</span><kbd>Ctrl / ⌘ + T</kbd></p><p><span>Закрыть вкладку</span><kbd>Ctrl / ⌘ + W</kbd></p></div></details></footer>
  </main>
</body>
</html>
