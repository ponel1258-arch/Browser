<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src 'self'; img-src 'self' https: http: data:; style-src 'self'; script-src 'self'">
  <title>Luma</title>
  <link rel="stylesheet" href="shell.css">
  <script src="shell.js" defer></script>
</head>
<body>
  <aside class="sidebar" aria-label="Боковая панель">
    <div class="sidebar-brand"><span class="brand-glyph" aria-hidden="true">l</span><strong>Luma</strong><span class="brand-caption">browser</span></div>
    <div class="space-label">Моё пространство</div>
    <div id="tabs" class="tabs" role="tablist" aria-orientation="vertical" aria-label="Вкладки"></div>
    <button id="new-tab" class="new-tab" title="Новая вкладка (Ctrl+T)" aria-label="Новая вкладка"><span aria-hidden="true">＋</span><span class="new-label">Новая вкладка</span><kbd>⌘ T</kbd></button>
    <div class="sidebar-bottom"><div class="memory-controls"><button id="saver-toggle" class="saver" aria-pressed="true" aria-label="Автоэкономия памяти"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4C10 3 4 8 6 15c2 6 12 5 14-11ZM5 21 15 10"/></svg><span id="memory-status" aria-live="polite">Экономия памяти</span></button><button id="sleep-tabs" class="icon-button" title="Усыпить фоновые вкладки сейчас" aria-label="Усыпить неактивные вкладки">z<sup>z</sup></button></div><div class="sidebar-footnote">Больше места для важного.</div></div>
  </aside>
  <header class="chrome"><div class="toolbar">
    <button id="toggle-sidebar" class="icon-button" title="Свернуть боковую панель" aria-label="Свернуть боковую панель" aria-expanded="true"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    <div class="toolbar-divider"></div>
    <button id="back" class="icon-button" title="Назад (Alt+←)" aria-label="Назад"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7M8 12h12"/></svg></button>
    <button id="forward" class="icon-button" title="Вперёд (Alt+→)" aria-label="Вперёд"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7M16 12H4"/></svg></button>
    <button id="reload" class="icon-button" title="Обновить (Ctrl+R)" aria-label="Обновить"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 8a8 8 0 1 0 1 4M19 4v4h-4"/></svg></button>
    <form id="address-form" class="address"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg><input id="address" name="address" aria-label="Адрес или поисковый запрос" placeholder="Поиск или адрес сайта…" autocomplete="off" spellcheck="false"><span class="address-hint">Ctrl / ⌘ L</span></form>
    <button id="home" class="icon-button" title="На главную" aria-label="На главную"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-6h6v6"/></svg></button>
  </div></header>
  <iframe id="home-surface" src="home.html" title="Стартовая страница Luma"></iframe>
</body>
</html>
